plugins {
	id 'java'
	id 'org.springframework.boot' version '3.3.6' apply false
	id 'io.spring.dependency-management' version '1.1.6'
}

group = 'com.readhub'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(17)
	}
}

repositories {
	mavenCentral()
}

allprojects {
	repositories {
		mavenCentral()
	}
}

subprojects {
	apply plugin: 'java'
	apply plugin: 'io.spring.dependency-management'

	java {
		toolchain {
			languageVersion = JavaLanguageVersion.of(17)
		}
	}

//	dependencyManagement {
//		imports {
//			mavenBom "org.springframework.boot:spring-boot-dependencies:3.3.6"
//		}
//	}

	configurations {
		compileOnly {
			extendsFrom annotationProcessor
		}
	}

	dependencies {
		compileOnly 'org.projectlombok:lombok:1.18.30'
		annotationProcessor 'org.projectlombok:lombok:1.18.30'
		testImplementation 'org.springframework.boot:spring-boot-starter-test'
		testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	}

	tasks.named('test') {
		useJUnitPlatform()
	}
}

project(':common') {
	apply plugin: 'org.springframework.boot'

	dependencies {
		implementation 'com.google.code.gson:gson:2.10.1'
		implementation 'org.springframework.boot:spring-boot-starter-data-jpa:3.3.6'
		implementation 'org.springframework.boot:spring-boot-starter-validation:3.3.6'
		implementation 'org.springframework.boot:spring-boot-starter-web:3.3.6'
//		implementation 'org.springframework.boot:spring-boot-starter-data-redis'
		implementation 'org.springframework.boot:spring-boot-starter-data-redis:3.3.6'
		implementation 'org.springframework.boot:spring-boot-starter-security:3.3.6'
		implementation 'org.springframework.boot:spring-boot-starter-oauth2-client'

		// jwt
		implementation 'io.jsonwebtoken:jjwt-api:0.11.5'
		runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.11.5'
		runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.11.5'

		testImplementation 'org.springframework.boot:spring-boot-starter-test:3.3.6'
	}
}

project(':user-service') {
	apply plugin: 'org.springframework.boot'

	dependencies {
		implementation project(':common')

		implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
		implementation 'org.springframework.boot:spring-boot-starter-security'
		implementation 'org.springframework.boot:spring-boot-starter-validation'
		implementation 'org.springframework.boot:spring-boot-starter-web'

		// Redis
		implementation 'org.mariadb.jdbc:mariadb-java-client:2.7.2'
		implementation 'org.springframework.boot:spring-boot-starter-data-redis'

		// MapStruct
		implementation 'org.mapstruct:mapstruct:1.5.5.Final'
		annotationProcessor 'org.mapstruct:mapstruct-processor:1.5.5.Final'

		// gson
		implementation 'com.google.code.gson:gson'

		// jwt
		implementation 'io.jsonwebtoken:jjwt-api:0.11.5'
		runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.11.5'
		runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.11.5'

		// OAuth2
		implementation 'org.springframework.boot:spring-boot-starter-oauth2-client'
		implementation 'org.springframework.boot:spring-boot-starter-thymeleaf'

		// kafka
		implementation 'org.springframework.kafka:spring-kafka'

		testImplementation 'org.springframework.security:spring-security-test'
	}
}

project(':book-service') {
	apply plugin: 'org.springframework.boot'

	dependencies {
		implementation project(':common')

		implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
		implementation 'org.springframework.boot:spring-boot-starter-validation'
		implementation 'org.springframework.boot:spring-boot-starter-web'

		implementation 'org.mapstruct:mapstruct:1.5.5.Final'
		annotationProcessor 'org.mapstruct:mapstruct-processor:1.5.5.Final'

		implementation 'org.springframework.boot:spring-boot-starter-security'

		implementation 'org.mariadb.jdbc:mariadb-java-client:2.7.2'
		implementation 'org.springframework.boot:spring-boot-starter-data-redis'

		implementation 'org.springframework.kafka:spring-kafka'
	}
}
